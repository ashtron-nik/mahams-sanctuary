<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Dream World &mdash; Dreambox</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ctext y='14' font-size='14'%3E%E2%9C%A8%3C/text%3E%3C/svg%3E">
<link rel="manifest" href="manifest.json">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,300;0,500;1,300;1,500&display=swap');
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
      cursor: url('cursor images/imresizer-meme-pop-cat-pack.jpg'), auto;

    background:#1f1a24; color:#ffebd2; font-family:Fraunces,Georgia,serif;
    overflow-x:hidden; min-height:100vh;
  }
  ::-webkit-scrollbar { width:4px; }
  ::-webkit-scrollbar-track { background:#181214; }
  ::-webkit-scrollbar-thumb { background:#3a2a20; border-radius:2px; }

  #dreamContent {
    position:relative; z-index:3; min-height:100vh;
    display:flex; flex-direction:column; align-items:center;
    padding:2rem 1.5rem 4rem;
    pointer-events:none;
  }
  #dreamContent > * { pointer-events:auto; }

  .dream-title {
    font-size:clamp(2rem, 8vw, 4.5rem); font-weight:300; font-style:italic;
    color:#ffe8c8; text-align:center; margin-top:8vh;
    text-shadow:0 0 60px rgba(255,200,150,0.15), 0 0 120px rgba(200,150,255,0.08);
    animation:titlePulse 6s ease-in-out infinite;
  }
  @keyframes titlePulse {
    0%, 100% { opacity:0.7; text-shadow:0 0 40px rgba(255,200,150,0.1); }
    50% { opacity:1; text-shadow:0 0 80px rgba(255,200,150,0.2), 0 0 160px rgba(200,150,255,0.12); }
  }

  .dream-subtitle {
    font-size:clamp(0.9rem, 3vw, 1.3rem); font-weight:300; font-style:italic;
    color:#c8b89e; text-align:center; margin-top:1rem; max-width:500px;
    opacity:0.7;
  }

  .dream-gallery {
    display:flex; flex-wrap:wrap; gap:1.5rem; justify-content:center;
    margin-top:4rem; max-width:900px; width:100%;
  }
  .dream-image {
    width:clamp(140px, 28vw, 260px); height:clamp(180px, 36vw, 340px);
    object-fit:cover; border-radius:12px; opacity:0;
    transform:translateY(30px) scale(0.95);
    transition:opacity 2s ease, transform 2s ease;
    box-shadow:0 8px 40px rgba(0,0,0,0.4);
    filter:brightness(0.85) saturate(0.9);
  }
  .dream-image.visible {
    opacity:0.75; transform:translateY(0) scale(1);
  }
  .dream-image:hover {
    opacity:1; transform:scale(1.03); filter:brightness(1) saturate(1);
    transition-duration:0.6s;
  }

  .dream-return {
    margin-top:2rem; padding:0.7rem 1.8rem;
    background:rgba(255,220,160,0.06); border:1px solid rgba(255,210,150,0.15);
    color:#6b5f52; border-radius:8px; cursor:pointer;
    font-family:Fraunces,Georgia,serif; font-size:0.9rem; font-style:italic;
    transition:all 0.3s; text-decoration:none; display:inline-block;
  }
  .dream-return:hover { border-color:#ffe680; color:#ffe680; background:rgba(255,220,160,0.1); }

  /* floating petals */
  .dream-petal {
    position:fixed; pointer-events:none; z-index:2;
    font-size:14px; opacity:0;
    animation:petalFloat linear forwards;
  }
  @keyframes petalFloat {
    0% { opacity:0; transform:translateY(0) rotate(0deg) scale(0.5); }
    10% { opacity:0.25; }
    90% { opacity:0.25; }
    100% { opacity:0; transform:translateY(-100vh) rotate(720deg) scale(1); }
  }

  /* floating orbs */
  .dream-orb {
    position:fixed; pointer-events:none; z-index:1;
    border-radius:50%;
    animation:orbDrift 8s ease-in-out infinite;
  }
  @keyframes orbDrift {
    0%, 100% { transform:translate(0, 0); }
    25% { transform:translate(30px, -20px); }
    50% { transform:translate(-20px, -40px); }
    75% { transform:translate(20px, -10px); }
  }


  /* dream page handles its own audio � hide jukebox UI */
  #jukeboxBtn, #jukeboxOverlay, #jukeboxPanel, #jukeboxMini { display:none !important; }

  /* ===== Lantern System ===== */
  .lantern-section {
    margin-top:3rem; width:100%; max-width:700px;
    opacity:1; transform:translateY(0);
  }

  .lantern-heading {
    font-size:clamp(1rem, 3vw, 1.4rem); font-weight:300; font-style:italic;
    color:#c8b89e; text-align:center; margin-bottom:1.5rem; opacity:0.8;
  }

  .lantern-list {
    display:flex; flex-direction:column; gap:1rem; align-items:center;
  }

  .lantern-card {
    background:rgba(255,220,160,0.04); border:1px solid rgba(255,210,150,0.1);
    border-radius:12px; padding:1rem 1.5rem; width:100%; max-width:500px;
    cursor:pointer; transition:all 0.4s;
    position:relative; overflow:hidden;
  }
  .lantern-card:hover {
    border-color:rgba(255,210,150,0.3);
    background:rgba(255,220,160,0.08);
  }
  .lantern-card.selected {
    border-color:rgba(255,210,150,0.5);
    background:rgba(255,220,160,0.1);
    box-shadow:0 0 30px rgba(255,200,150,0.1);
  }

  .lantern-wish {
    font-size:0.95rem; font-style:italic; color:#c8b89e; line-height:1.6;
  }

  .lantern-controls {
    margin-top:0.8rem; display:none; flex-direction:column; gap:0.6rem;
  }
  .lantern-card.selected .lantern-controls { display:flex; }

  .lantern-row {
    display:flex; align-items:center; gap:0.8rem; font-size:0.8rem; color:#8a7e70;
  }
  .lantern-row label { min-width:50px; }
  .lantern-colors {
    display:flex; gap:0.4rem;
  }
  .lantern-color-swatch {
    width:22px; height:22px; border-radius:50%; border:2px solid transparent;
    cursor:pointer; transition:all 0.3s;
  }
  .lantern-color-swatch.active { border-color:#fff; transform:scale(1.2); }

  .lantern-slider {
    -webkit-appearance:none; appearance:none; width:120px; height:3px;
    background:rgba(255,210,150,0.2); border-radius:2px; outline:none;
  }
  .lantern-slider::-webkit-slider-thumb {
    -webkit-appearance:none; width:12px; height:12px; border-radius:50%;
    background:#ffe680; cursor:pointer;
  }

  .lantern-release-btn {
    margin-top:0.5rem; padding:0.5rem 1.2rem;
    background:rgba(255,220,160,0.1); border:1px solid rgba(255,210,150,0.25);
    color:#ffe680; border-radius:6px; cursor:pointer;
    font-family:Fraunces,Georgia,serif; font-size:0.85rem; font-style:italic;
    transition:all 0.3s; align-self:center;
  }
  .lantern-release-btn:hover {
    background:rgba(255,220,160,0.2); border-color:#ffe680;
    box-shadow:0 0 20px rgba(255,200,150,0.15);
  }
  .lantern-release-btn:disabled { opacity:0.3; cursor:default; }

  .lantern-count {
    font-size:0.75rem; color:#6b5f52; text-align:center; margin-top:0.8rem; font-style:italic;
  }

  .lantern-empty {
    text-align:center; font-style:italic; color:#6b5f52; font-size:0.9rem;
    margin-top:1rem; opacity:0.7;
  }

  /* Released lantern floating up */
  .lantern-float {
    position:fixed; pointer-events:none; z-index:10;
    font-size:28px; transition:none;
    animation:lanternRise 4s ease-out forwards;
  }
  @keyframes lanternRise {
    0% { opacity:1; transform:translateY(0) scale(1); }
    70% { opacity:0.8; }
    100% { opacity:0; transform:translateY(-85vh) scale(0.5); }
  }

  /* Sparkle on reload */
  .sparkle {
    position:fixed; pointer-events:none; z-index:10;
    width:4px; height:4px; border-radius:50%;
    background:#ffe680; box-shadow:0 0 6px #ffe680;
    animation:sparklePop 1.2s ease-out forwards;
  }
  @keyframes sparklePop {
    0% { opacity:0; transform:scale(0); }
    30% { opacity:1; transform:scale(1.5); }
    100% { opacity:0; transform:scale(0); }
  }

  /* Lantern History */
  .lantern-history {
    margin-top:3rem; width:100%; max-width:500px;
    opacity:0; transform:translateY(20px);
    transition:opacity 2s ease 3s, transform 2s ease 3s;
  }
  .lantern-history.visible { opacity:1; transform:translateY(0); }

  .lantern-history-heading {
    font-size:0.85rem; font-weight:300; font-style:italic;
    color:#6b5f52; text-align:center; margin-bottom:1rem;
    letter-spacing:0.05em;
  }

  .lantern-history-list {
    display:flex; flex-direction:column; gap:0.6rem; align-items:center;
  }

  .lantern-history-item {
    display:flex; align-items:center; gap:0.8rem;
    padding:0.6rem 1rem; border-radius:8px;
    background:rgba(255,220,160,0.03); border:1px solid rgba(255,210,150,0.06);
    width:100%; max-width:460px;
    opacity:0; transform:translateY(10px);
    transition:opacity 1s ease, transform 1s ease;
  }
  .lantern-history-item.visible { opacity:0.8; transform:translateY(0); }

  .lantern-history-icon {
    font-size:18px; flex-shrink:0;
    filter:drop-shadow(0 0 4px rgba(255,200,150,0.3));
  }

  .lantern-history-body {
    flex:1; min-width:0;
  }

  .lantern-history-wish {
    font-size:0.82rem; font-style:italic; color:#a89a88;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }

  .lantern-history-meta {
    font-size:0.68rem; color:#5a5048; margin-top:0.15rem;
  }

  .lantern-history-empty {
    text-align:center; font-style:italic; color:#5a5048; font-size:0.8rem;
    opacity:0.5; padding:1rem 0;
  }

  /* ---- Dream Journal ---- */
  .dream-journal {
    margin-top:4rem; width:100%; max-width:700px;
    opacity:0; transform:translateY(20px);
    transition:opacity 2s ease 1.5s, transform 2s ease 1.5s;
  }
  .dream-journal.visible { opacity:1; transform:translateY(0); }

  .dream-journal-title {
    font-size:clamp(1rem, 3vw, 1.4rem); font-weight:300; font-style:italic;
    color:#c8b89e; text-align:center; margin-bottom:2rem; opacity:0.8;
  }

  .dream-entries {
    display:flex; flex-direction:column; gap:1.2rem;
  }

  .dream-entry {
    max-width:85%; padding:1rem 1.3rem; border-radius:16px;
    font-size:clamp(0.88rem, 2.2vw, 1rem); line-height:1.75;
    font-weight:300; font-style:italic;
    opacity:1;
  }
  .dream-entry. {
    align-self:flex-start;
    background:rgba(200,170,255,0.08); border:1px solid rgba(200,170,255,0.18);
    color:#d4c8f0; border-bottom-left-radius:4px;
  }
  .dream-entry.you {
    align-self:flex-end;
    background:rgba(255,220,160,0.06); border:1px solid rgba(255,210,150,0.12);
    color:#c8b89e; border-bottom-right-radius:4px;
  }

  .dream-entry-label {
    font-size:0.7rem; text-transform:uppercase; letter-spacing:0.08em;
    margin-bottom:0.3rem; opacity:0.5;
  }
  .dream-entry. .dream-entry-label { color:#b8a0e0; }
  .dream-entry.you .dream-entry-label { color:#b8a880; }

  .dream-entry-text { margin-bottom:0.4rem; }
  .dream-entry-time {
    font-size:0.65rem; color:#6b5f52; font-style:normal;
  }

  .dream-entry audio {
    width:100%; margin-top:0.3rem; border-radius:6px;
  }

  .dream-reply-form {
    margin-top:2rem; display:flex; flex-direction:column; gap:0.7rem;
    max-width:600px; width:100%; align-self:center;
  }
  .dream-reply-form textarea {
    width:100%; padding:.7rem .9rem; border-radius:10px;
    background:rgba(255,220,160,0.04); border:1px solid rgba(255,210,150,0.1);
    color:#ffebd2; font-family:Fraunces,Georgia,serif; font-size:.9rem;
    font-style:italic; outline:none; resize:vertical; min-height:60px;
    transition:border-color 0.3s;
  }
  .dream-reply-form textarea:focus { border-color:rgba(255,210,150,0.3); }

  .dream-reply-controls {
    display:flex; gap:0.6rem; align-items:center; flex-wrap:wrap;
  }
  .dream-reply-controls button {
    padding:.5rem 1.2rem; border-radius:8px; cursor:pointer;
    font-family:Fraunces,Georgia,serif; font-size:.85rem; font-style:italic;
    transition:all 0.25s;
  }
  .dream-reply-send {
    background:rgba(255,230,128,.1); border:1px solid #ffe680;
    color:#ffe680; flex:1;
  }
  .dream-reply-send:hover { background:#ffe680; color:#181214; }
  .dream-reply-send:disabled { opacity:0.3; cursor:default; }

  .dream-reply-record {
    background:rgba(232,93,58,.1); border:1px solid #e85d3a;
    color:#e85d3a;
  }
  .dream-reply-record:hover { background:#e85d3a; color:#fff; }
  .dream-reply-record.recording {
    background:#e85d3a; color:#fff;
    animation:recordPulse 1s ease-in-out infinite;
  }
  @keyframes recordPulse {
    0%, 100% { opacity:1; }
    50% { opacity:0.5; }
  }

  .dream-empty {
    text-align:center; font-style:italic; color:#6b5f52; font-size:0.9rem;
    padding:2rem 0; opacity:0.7;
  }
</style>
</head>
<body>

<div id="skyOverlay" style="position:fixed;inset:0;z-index:1;pointer-events:none;opacity:1;"></div>
<!-- dream overlay glow removed -->

<div id="dreamContent">
  <div class="dream-title">A Dream of You</div>
  <div class="dream-subtitle">Where every thought of you floats softly in the light</div>

  <div class="dream-gallery" id="dreamGallery"></div>

  <div class="lantern-section" id="lanternSection" style="opacity:1;transform:none;">
    <div class="lantern-heading">Release a wish into the sky</div>
    <div class="lantern-list" id="lanternList">
      <div style="text-align:center;color:#6b5f52;font-style:italic;font-size:0.85rem;padding:1rem;">Loading wishes...</div>
    </div>
    <div class="lantern-count" id="lanternCount"></div>
  </div>

  <div class="lantern-history" id="lanternHistory">
    <div class="lantern-history-heading">wishes released into the sky</div>
    <div class="lantern-history-list" id="lanternHistoryList"></div>
  </div>

  <div class="dream-journal" id="dreamJournal">
    <div class="dream-journal-title">Dream Journal</div>
    <div class="dream-entries" id="dreamEntries"></div>
    <div class="dream-reply-form" id="dreamReplyForm">
      <textarea id="dreamReplyInput" placeholder="Your reply... or record a voice message..." rows="2"></textarea>
      <div class="dream-reply-controls">
        <button class="dream-reply-record" id="dreamRecordBtn">&#x1F3A7; Record</button>
        <button class="dream-reply-send" id="dreamSendBtn">&#x2728; Send</button>
      </div>
    </div>
  </div>

  <a href="index.html" class="dream-return">&larr; Return from the dream</a>
</div>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="fb-db.js"></script>
<script src="skies.js"></script>
<script src="sky-living.js"></script>
<script src="landscape.js"></script>
  <script src="interactive.js"></script>
  <script defer src="music.js"></script>
  <script defer src="matrix-rain.js"></script>
  <script defer src="global-easter-eggs.js"></script>
<script defer src="interactions.js"></script>

<script>
(function () {
  'use strict';
  // Track dream page visit
  try { localStorage.setItem('dream-viewed', '1'); } catch (e) {}

  // Inject Floating Lanterns sky (removed from global skies.js, dream-only)
  var LANTERN_SKY = {"gradient": [[0, "#1a1030"], [0.35, "#33163c"], [0.7, "#5c2a3e"], [1, "#7a3a2e"]], "particles": [{"type": "ember", "count": 22, "minR": 7, "maxR": 14, "minSpeed": 3, "maxSpeed": 8, "color": "#ffb35c"}], "name": "Floating Lanterns", "message": "I keep sending my wishes up to you, one lantern at a time"};
  var skies = window.Skies && window.Skies.SKIES;
  if (skies) {
    skies.push(LANTERN_SKY);
    try { window.Skies.apply(skies.length - 1); } catch (e) {}
  }

  // ===== Floating parallax images =====
  var DREAM_IMAGES = [
    './parallax/parallax_moon.png',
    './parallax/parallax_stars.png',
    './parallax/parallax_firefly.png',
    './parallax/parallax_petals.png',
    './parallax/parallax_constellation.png',
    './parallax/parallax_lanterns.png',
    './parallax/parallax_reading.png',
    './parallax/parallax_letter.png',
    './parallax/parallax_candle.png',
    './parallax/parallax_rain.png',
    './parallax/parallax_fog.png'
  ];

  var gallery = document.getElementById('dreamGallery');
  var shuffled = DREAM_IMAGES.slice().sort(function () { return Math.random() - 0.5; }).slice(0, 6);

  shuffled.forEach(function (src, idx) {
    var img = document.createElement('img');
    img.className = 'dream-image';
    img.src = src;
    img.alt = 'Dream image';
    img.loading = 'lazy';
    gallery.appendChild(img);
    setTimeout(function () { img.classList.add('visible'); }, 500 + idx * 400);
  });

  // ===== Floating petals =====
  var PETAL_CHARS = ['\uD83C\uDF38', '\uD83C\uDF3A', '\u2726', '\u2734', '\u00B7'];
  function spawnPetal() {
    var el = document.createElement('div');
    el.className = 'dream-petal';
    el.textContent = PETAL_CHARS[Math.floor(Math.random() * PETAL_CHARS.length)];
    el.style.left = Math.random() * 100 + 'vw';
    el.style.bottom = '-20px';
    el.style.fontSize = (8 + Math.random() * 12) + 'px';
    el.style.animationDuration = (10 + Math.random() * 15) + 's';
    el.style.animationDelay = (Math.random() * 3) + 's';
    document.body.appendChild(el);
    setTimeout(function () { if (el.parentNode) el.parentNode.removeChild(el); }, 28000);
  }
  for (var pi = 0; pi < 20; pi++) setTimeout(spawnPetal, pi * 600);
  setInterval(spawnPetal, 3000);

  // ===== Ambient floating orbs =====
  var ORB_COLORS = ['rgba(255,200,150,0.03)', 'rgba(200,150,255,0.03)', 'rgba(150,200,255,0.03)', 'rgba(255,150,200,0.03)'];
  var orbs = [];
  for (var oi = 0; oi < 6; oi++) {
    var orb = document.createElement('div');
    orb.className = 'dream-orb';
    var size = 40 + Math.random() * 80;
    orb.style.cssText = 'left:' + (Math.random() * 100) + 'vw;top:' + (Math.random() * 100) + 'vh;' +
      'width:' + size + 'px;height:' + size + 'px;' +
      'background:' + ORB_COLORS[Math.floor(Math.random() * ORB_COLORS.length)] + ';' +
      'box-shadow:0 0 ' + (size * 0.5) + 'px ' + ORB_COLORS[Math.floor(Math.random() * ORB_COLORS.length)] + ';' +
      'animation-delay:' + (Math.random() * 5) + 's;' +
      'animation-duration:' + (6 + Math.random() * 6) + 's;';
    document.body.appendChild(orb);
    orbs.push(orb);
  }

  // ===== Audio: try to load a song =====
  if (window.FB && FB.init) {
    try { FB.init(); } catch (e) {}
    FB.getAll('songs').then(function (songs) {
      if (songs && songs.length) {
        var pick = songs[Math.floor(Math.random() * songs.length)];
        if (pick && pick.audioBlob) {
          var url = URL.createObjectURL(pick.audioBlob);
          var audio = new Audio(url);
          audio.loop = false;
          audio.volume = 0.25;
          audio.play().catch(function () {});
        }
      }
    }).catch(function () {});
  }

  // ===== Dreamlike scroll reveal =====
  var observer = new IntersectionObserver(function (entries) {
    entries.forEach(function (e) {
      if (e.isIntersecting) e.target.classList.add('visible');
    });
  }, { threshold: 0.15 });
  document.querySelectorAll('.dream-image').forEach(function (el) {
    observer.observe(el);
  });
})();
</script>

<script>
(function () {
  'use strict';

  // ponytail: defensive try-catch � if this script is reached by a later
  // DOMContentLoaded fallback, the outer catch prevents silent failures.
  try {

  // ===== Lantern System =====
  var LANTERN_COLORS = [
    { name: 'Gold', hex: '#ffe680', glow: 'rgba(255,230,128,0.4)' },
    { name: 'Rose', hex: '#ffaaaa', glow: 'rgba(255,170,170,0.4)' },
    { name: 'Lavender', hex: '#c8a8ff', glow: 'rgba(200,168,255,0.4)' },
    { name: 'Sky', hex: '#a8d8ff', glow: 'rgba(168,216,255,0.4)' },
    { name: 'Peach', hex: '#ffd0a8', glow: 'rgba(255,208,168,0.4)' },
    { name: 'Mint', hex: '#a8ffd8', glow: 'rgba(168,255,216,0.4)' }
  ];
  var MAX_RELEASED = Infinity;

  function getWishes() {
    try {
      var w = JSON.parse(localStorage.getItem('wish-journal') || '[]');
      if (w.length > 0) return w;
    } catch (e) {}
    // fallback: demo wishes so lantern UI always shows
    return [
      { id: 'demo1', text: 'I wish to hold your hand under the stars', granted: true, createdAt: Date.now() - 86400000 },
      { id: 'demo2', text: 'I wish every sunset reminded you of me', granted: true, createdAt: Date.now() - 43200000 },
      { id: 'demo3', text: 'I wish you dreams full of light', granted: true, createdAt: Date.now() }
    ];
  }
  function getReleased() {
    try {
      var raw = JSON.parse(localStorage.getItem('lanterns-released') || '[]');
      // normalize: old entries were plain strings, new ones are objects
      return raw.map(function (item) {
        if (typeof item === 'string') return { wish: item, color: '#ffe680', glow: 0.6, time: 0 };
        return item;
      });
    } catch (e) { return []; }
  }
  function saveReleased(arr) {
    localStorage.setItem('lanterns-released', JSON.stringify(arr));
  }

  function renderLanterns() {
    var list = document.getElementById('lanternList');
    var countEl = document.getElementById('lanternCount');
    var section = document.getElementById('lanternSection');
    var wishes = getWishes();
    var released = getReleased();
    var releasedTexts = released.map(function (r) { return r.wish; });
    var ungranted = wishes.filter(function (w) {
      return releasedTexts.indexOf(w.text) === -1;
    });

    if (wishes.length === 0) {
      section.style.display = 'none';
      return;
    }
    if (ungranted.length === 0) {
      list.innerHTML = '<div class="lantern-empty">All wishes have been released as lanterns</div>';
      section.style.display = '';
      setTimeout(function () { section.classList.add('visible'); }, 100);
      countEl.textContent = '';
      return;
    }
    section.style.display = '';
    setTimeout(function () { section.classList.add('visible'); }, 100);

    list.innerHTML = '';

    ungranted.forEach(function (wish, idx) {
      var card = document.createElement('div');
      card.className = 'lantern-card';
      card.dataset.wish = wish.text;

      var topRow = document.createElement('div');
      topRow.style.cssText = 'display:flex;justify-content:space-between;align-items:center;gap:8px;';

      var wishEl = document.createElement('div');
      wishEl.className = 'lantern-wish';
      wishEl.textContent = wish.text;
      topRow.appendChild(wishEl);

      var delBtn = document.createElement('button');
      delBtn.textContent = '\u2716';
      delBtn.title = 'Delete wish';
      delBtn.style.cssText = 'background:none;border:none;color:#6b5f52;cursor:pointer;font-size:0.85rem;padding:2px 6px;border-radius:4px;transition:all 0.2s;flex-shrink:0;';
      delBtn.addEventListener('mouseenter', function () { this.style.color = '#e85d3a'; this.style.background = 'rgba(232,93,58,0.1)'; });
      delBtn.addEventListener('mouseleave', function () { this.style.color = '#6b5f52'; this.style.background = 'none'; });
      delBtn.addEventListener('click', function (e) {
        e.stopPropagation();
        if (!confirm('Delete this wish?')) return;
        var wishes = getWishes();
        for (var i = 0; i < wishes.length; i++) { if (wishes[i].text === wish.text) { wishes.splice(i, 1); break; } }
        localStorage.setItem('wish-journal', JSON.stringify(wishes));
        renderLanterns();
      });
      topRow.appendChild(delBtn);

      card.appendChild(topRow);

      var controls = document.createElement('div');
      controls.className = 'lantern-controls';

      // color row
      var colorRow = document.createElement('div');
      colorRow.className = 'lantern-row';
      var colorLabel = document.createElement('label');
      colorLabel.textContent = 'Color';
      colorRow.appendChild(colorLabel);
      var colorsDiv = document.createElement('div');
      colorsDiv.className = 'lantern-colors';
      var selectedColor = 0;
      LANTERN_COLORS.forEach(function (c, ci) {
        var swatch = document.createElement('div');
        swatch.className = 'lantern-color-swatch' + (ci === 0 ? ' active' : '');
        swatch.style.background = c.hex;
        swatch.style.boxShadow = '0 0 8px ' + c.glow;
        swatch.addEventListener('click', function () {
          colorsDiv.querySelectorAll('.lantern-color-swatch').forEach(function (s) { s.classList.remove('active'); });
          swatch.classList.add('active');
          selectedColor = ci;
          card.dataset.color = ci;
        });
        colorsDiv.appendChild(swatch);
      });
      colorRow.appendChild(colorsDiv);
      controls.appendChild(colorRow);

      // glow row
      var glowRow = document.createElement('div');
      glowRow.className = 'lantern-row';
      var glowLabel = document.createElement('label');
      glowLabel.textContent = 'Glow';
      glowRow.appendChild(glowLabel);
      var slider = document.createElement('input');
      slider.type = 'range'; slider.min = '0'; slider.max = '100'; slider.value = '60';
      slider.className = 'lantern-slider';
      glowRow.appendChild(slider);
      controls.appendChild(glowRow);

      // release button
      var btn = document.createElement('button');
      btn.className = 'lantern-release-btn';
      btn.textContent = 'Release into the sky';
      btn.addEventListener('click', function (e) {
        e.stopPropagation();
        releaseLantern(wish.text, selectedColor, parseInt(slider.value) / 100, card);
      });
      controls.appendChild(btn);

      card.appendChild(controls);

      card.addEventListener('click', function () {
        var wasSelected = card.classList.contains('selected');
        list.querySelectorAll('.lantern-card').forEach(function (c) { c.classList.remove('selected'); });
        if (!wasSelected) card.classList.add('selected');
      });

      list.appendChild(card);
    });

    countEl.textContent = released.length + ' lantern' + (released.length !== 1 ? 's' : '') + ' released into the sky';
  }

  function releaseLantern(wishText, colorIdx, glowIntensity, cardEl) {
    var released = getReleased();
    var color = LANTERN_COLORS[colorIdx] || LANTERN_COLORS[0];
    released.push({ wish: wishText, color: color.hex, glow: glowIntensity, time: Date.now() });
    saveReleased(released);
    if (window.Interactions) window.Interactions.record('wish', 'lantern_released', String(wishText || '').slice(0, 100));

    var rect = cardEl.getBoundingClientRect();
    var cx = rect.left + rect.width / 2;
    var cy = rect.top;

    // floating lantern
    var lantern = document.createElement('div');
    lantern.className = 'lantern-float';
    lantern.textContent = '\uD83C\uDFEE';
    lantern.style.left = cx + 'px';
    lantern.style.top = cy + 'px';
    lantern.style.filter = 'drop-shadow(0 0 ' + (10 + glowIntensity * 20) + 'px ' + color.glow + ')';
    document.body.appendChild(lantern);

    // sparkles at launch site
    for (var i = 0; i < 8; i++) {
      spawnSparkle(
        cx + (Math.random() - 0.5) * 40,
        cy + (Math.random() - 0.5) * 30,
        color.hex
      );
    }

    setTimeout(function () {
      if (lantern.parentNode) lantern.parentNode.removeChild(lantern);
      renderLanterns();
    }, 4200);

    // firebase sync
    if (window.FB && FB.init) {
      FB.init();
      FB.getAll('lanterns').then(function (existing) {
        var arr = existing || [];
        arr.push({ wish: wishText, color: color.hex, glow: glowIntensity, time: Date.now() });
        return FB.set('lanterns', arr);
      }).catch(function () {});
    }
  }

  function spawnSparkle(x, y, color) {
    var s = document.createElement('div');
    s.className = 'sparkle';
    s.style.left = x + 'px';
    s.style.top = y + 'px';
    s.style.background = color;
    s.style.boxShadow = '0 0 6px ' + color;
    s.style.animationDelay = (Math.random() * 0.3) + 's';
    document.body.appendChild(s);
    setTimeout(function () { if (s.parentNode) s.parentNode.removeChild(s); }, 1500);
  }

  // On load: sparkle effect for previously released lanterns
  var prevReleased = getReleased();
  if (prevReleased.length > 0) {
    for (var ri = 0; ri < Math.min(prevReleased.length * 4, 12); ri++) {
      setTimeout(function () {
        var pick = prevReleased[Math.floor(Math.random() * prevReleased.length)];
        spawnSparkle(
          Math.random() * window.innerWidth,
          Math.random() * window.innerHeight * 0.6,
          pick.color || '#ffe680'
        );
      }, ri * 200);
    }
  }

  renderLanterns();
  renderHistory();

  // ===== Lantern History =====
  function renderHistory() {
    var container = document.getElementById('lanternHistory');
    var list = document.getElementById('lanternHistoryList');
    var released = getReleased();
    var withTime = released.filter(function (r) { return r.time > 0; });

    if (withTime.length === 0) {
      container.style.display = 'none';
      return;
    }
    container.style.display = '';
    setTimeout(function () { container.classList.add('visible'); }, 100);

    list.innerHTML = '';
    // newest first
    var sorted = withTime.slice().sort(function (a, b) { return b.time - a.time; });

    sorted.forEach(function (entry, idx) {
      var item = document.createElement('div');
      item.className = 'lantern-history-item';

      var icon = document.createElement('div');
      icon.className = 'lantern-history-icon';
      icon.textContent = '\uD83C\uDFEE';
      icon.style.filter = 'drop-shadow(0 0 5px ' + (entry.color || '#ffe680') + '40)';
      item.appendChild(icon);

      var body = document.createElement('div');
      body.className = 'lantern-history-body';

      var wishEl = document.createElement('div');
      wishEl.className = 'lantern-history-wish';
      wishEl.textContent = entry.wish;
      body.appendChild(wishEl);

      var meta = document.createElement('div');
      meta.className = 'lantern-history-meta';
      var d = new Date(entry.time);
      var months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
      meta.textContent = 'released ' + months[d.getMonth()] + ' ' + d.getDate() + ', ' + d.getFullYear();
      body.appendChild(meta);

      item.appendChild(body);
      list.appendChild(item);

      setTimeout(function () { item.classList.add('visible'); }, 200 + idx * 150);
    });
  }

  } catch (e) { console.error('[DREAM] Lantern script error:', e); }

  // Fallback: if lantern section still empty after DOMContentLoaded, retry once
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', function () {
      var section = document.getElementById('lanternSection');
      var list = document.getElementById('lanternList');
      if (section && list && !list.children.length) {
        try { renderLanterns(); renderHistory(); } catch (e) {}
      }
    });
  }

  // Auto-open lantern world when arriving via ?lanterns (from the global trigger on pages without interactive.js)
  if (window.location.search.indexOf('lanterns') !== -1) {
    var tryOpen = function () {
      if (typeof window._openLanternWorld === 'function') { window._openLanternWorld(); }
      else { setTimeout(tryOpen, 400); }
    };
    tryOpen();
  }
})();
</script>
<script>
(function () {
  'use strict';
  var DREAM_REFRESH_INTERVAL = null;
  var dreamRecorder = null;
  var dreamRecordStream = null;
  var dreamAudioChunks = [];

  function esc(s) {
    if (typeof s !== 'string') return s;
    return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#039;');
  }

  function fmtDate(ts) {
    if (!ts) return '';
    var d = new Date(ts);
    var months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    return months[d.getMonth()] + ' ' + d.getDate() + ', ' + d.getFullYear();
  }

  var SEEDED__DREAM = {
    id: 'dream_seeded_',
    author: '',
    type: 'text',
    text: 'I dreamed we were lying on a rooftop somewhere neither of us had ever been. The sky was full of stars — the kind you only see when you are far from every city. You were sleeping on my chest, and I was counting your breaths because they reminded me that some things are real. There was no noise. No future. No past. Just your weight on me, and the certainty that I would stay like that forever if the dream let me.',
    createdAt: 1720000000000
  };

  function loadDreams() {
    if (typeof FB === 'undefined' || !FB.init) return;
    FB.init();
    FB.getAll('dreams').then(function (items) {
      items = items || [];
      var hasSeed = items.some(function (i) { return i.id === SEEDED__DREAM.id; });
      if (!hasSeed) {
        FB.put('dreams', SEEDED__DREAM).catch(function () {});
        items.push(SEEDED__DREAM);
      }
      renderDreams(items);
    }).catch(function () {
      renderDreams([SEEDED__DREAM]);
    });
  }

  function renderDreams(items) {
    var container = document.getElementById('dreamEntries');
    if (!container) return;
    if (!items.length) {
      container.innerHTML = '<div class="dream-empty">No dreams yet...</div>';
      return;
    }
    items.sort(function (a, b) { return a.createdAt - b.createdAt; });
    var html = '';
    for (var i = 0; i < items.length; i++) {
      var d = items[i];
      var author = d.author === '' ? 'Dream' : 'Your Dream';
      var cls = d.author === '' ? '' : 'you';
      html += '<div class="dream-entry ' + cls + '">';
      html += '<div class="dream-entry-label">' + author + '</div>';
      if (d.text) {
        html += '<div class="dream-entry-text">' + esc(d.text) + '</div>';
      }
      if (d.type === 'voice' && d.audioBlob) {
        var url = URL.createObjectURL(d.audioBlob);
        html += '<audio controls src="' + url + '"></audio>';
      }
      html += '<div class="dream-entry-time">' + fmtDate(d.createdAt) + '</div>';
      html += '</div>';
    }
    container.innerHTML = html;
  }

  function getAudioBlob() {
    if (!dreamAudioChunks.length) return null;
    var blob = new Blob(dreamAudioChunks, { type: 'audio/webm' });
    dreamAudioChunks = [];
    return blob;
  }

  // Init
  var sendBtn = document.getElementById('dreamSendBtn');
  var input = document.getElementById('dreamReplyInput');
  var recordBtn = document.getElementById('dreamRecordBtn');

  function submitReply() {
    var text = (input ? input.value : '').trim();
    var blob = getAudioBlob();
    if (!text && !blob) return;
    if (typeof FB === 'undefined' || !FB.init) return;
    FB.init();
    var entry = {
      id: 'dream_' + Date.now(),
      author: 'you',
      type: blob ? 'voice' : 'text',
      createdAt: Date.now()
    };
    if (text) entry.text = text;
    if (blob) {
      // fb-db.js handles blob to base64 conversion
      entry.audioBlob = blob;
    }
    sendBtn.disabled = true;
    sendBtn.textContent = 'Sending...';
    FB.put('dreams', entry).then(function () {
      if (input) input.value = '';
      sendBtn.disabled = false;
      sendBtn.textContent = '\u2728 Send';
      loadDreams();
    }).catch(function () {
      sendBtn.disabled = false;
      sendBtn.textContent = '\u2728 Send';
      alert('Failed to send reply.');
    });
  }

  if (sendBtn && input) {
    sendBtn.addEventListener('click', submitReply);
    input.addEventListener('keydown', function (e) {
      if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); submitReply(); }
    });
  }

  if (recordBtn) {
    recordBtn.addEventListener('click', function () {
      if (dreamRecorder && dreamRecorder.state === 'recording') {
        dreamRecorder.stop();
        return;
      }
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        alert('Voice recording not supported in this browser.');
        return;
      }
      navigator.mediaDevices.getUserMedia({ audio: true }).then(function (stream) {
        dreamRecordStream = stream;
        dreamAudioChunks = [];
        dreamRecorder = new MediaRecorder(stream);
        dreamRecorder.ondataavailable = function (e) {
          if (e.data.size > 0) dreamAudioChunks.push(e.data);
        };
        dreamRecorder.onstop = function () {
          if (dreamRecordStream) {
            dreamRecordStream.getTracks().forEach(function (t) { t.stop(); });
            dreamRecordStream = null;
          }
          dreamRecorder = null;
          recordBtn.textContent = '\uD83C\uDFA7 Record';
          recordBtn.classList.remove('recording');
          if (input) input.placeholder = dreamAudioChunks.length ? 'Voice message ready! Add text or just send...' : "Your reply... or record a voice message...";
        };
        dreamRecorder.start();
        recordBtn.textContent = '\u23F9 Stop';
        recordBtn.classList.add('recording');
      }).catch(function () {
        alert('Microphone access denied.');
      });
    });
  }

  loadDreams();
  if (DREAM_REFRESH_INTERVAL) clearInterval(DREAM_REFRESH_INTERVAL);
  DREAM_REFRESH_INTERVAL = setInterval(loadDreams, 8000);

  document.getElementById('dreamJournal') && setTimeout(function () {
    document.getElementById('dreamJournal').classList.add('visible');
  }, 500);
})();
</script>

<script>
(function () {
  function dreamToast(msg) {
    var el = document.createElement('div');
    el.textContent = msg;
    el.style.cssText = 'position:fixed;bottom:30px;left:50%;transform:translateX(-50%);background:rgba(255,230,128,0.85);color:#181214;padding:8px 18px;border-radius:20px;font-size:14px;z-index:999999;pointer-events:none;transition:opacity 0.5s;opacity:1;';
    document.body.appendChild(el);
    setTimeout(function () { el.style.opacity = '0'; setTimeout(function () { el.remove(); }, 500); }, 2500);
  }
  document.addEventListener('dblclick', function (e) {
    var t = e.target;
    if (t.closest && (t.closest('#dreamContent') || t === document.body || t === document.documentElement)) {
      showDreamWishModal();
    }
  });
  function showDreamWishModal() {
    if (document.getElementById('dreamWishOverlay')) return;
    var overlay = document.createElement('div');
    overlay.id = 'dreamWishOverlay';
    overlay.style.cssText = 'position:fixed;inset:0;z-index:99999;background:rgba(0,0,0,0.5);display:flex;align-items:center;justify-content:center;';
    var modal = document.createElement('div');
    modal.style.cssText = 'background:#1c181a;border:1px solid rgba(255,210,150,.15);border-radius:16px;padding:1.5rem;width:300px;box-shadow:0 8px 40px rgba(0,0,0,.7);text-align:center;';
    modal.innerHTML =
      '<div style="font-size:2rem;margin-bottom:0.5rem;">\u2B50</div>' +
      '<div style="font-family:Fraunces,Georgia,serif;color:#ffe680;font-size:1rem;margin-bottom:0.8rem;">Make a wish</div>' +
      '<textarea id="dreamWishInput" placeholder="What do you wish for?" style="width:100%;background:rgba(255,220,160,.04);border:1px solid rgba(255,210,150,.1);color:#ffebd2;padding:0.6rem;border-radius:8px;font-family:inherit;font-size:0.85rem;resize:none;height:80px;outline:none;"></textarea>' +
      '<div style="display:flex;gap:8px;justify-content:center;margin-top:0.8rem;">' +
        '<button id="dreamWishSave" style="background:rgba(255,230,128,.15);border:1px solid rgba(255,230,128,.35);color:#ffe680;padding:0.4rem 1rem;border-radius:6px;cursor:pointer;font-family:inherit;font-size:0.8rem;">\u2728 Save</button>' +
        '<button id="dreamWishCancel" style="background:rgba(255,220,160,.04);border:1px solid rgba(255,210,150,.1);color:#c7b8a1;padding:0.4rem 1rem;border-radius:6px;cursor:pointer;font-family:inherit;font-size:0.8rem;">Cancel</button>' +
      '</div>';
    overlay.appendChild(modal);
    document.body.appendChild(overlay);
    document.getElementById('dreamWishInput').focus();
    document.getElementById('dreamWishSave').addEventListener('click', function () {
      var text = document.getElementById('dreamWishInput').value.trim();
      if (text && window.WishSystem) {
        window.WishSystem.addWish(text, 'dream');
        dreamToast('\u2B50 Wish saved \u2728');
      }
      overlay.remove();
    });
    document.getElementById('dreamWishCancel').addEventListener('click', function () { overlay.remove(); });
    overlay.addEventListener('click', function (e) { if (e.target === overlay) overlay.remove(); });
  }
})();
</script>
